<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>MineraSTU CNJ para Excel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
  <div class="container">
    <h2>MINERADORA CNJ PARA EXCEL</h2>

    <section class="arquivo-section">
      <label for="arquivo">SELECIONE O ARQUIVO DESEJADO <span class="detalhe">(formato necessário: CSV // Na primeira linha deve estar escrito: processo_cnj // Uma numeração por linha)</span></label>
      <div class="arquivo-box">
        <span id="nomeArquivo">Nome do arquivo</span>
        <input type="file" id="arquivo" accept=".csv" />
        <div id="botaoAbrirArquivo" class="icone-pasta" title="Selecionar arquivo CSV">
  <svg
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M4 1.5C2.89543 1.5 2 2.39543 2 3.5V4.5C2 4.55666 2.00236 4.61278 2.00698 4.66825C0.838141 5.07811 0 6.19118 0 7.5V19.5C0 21.1569 1.34315 22.5 3 22.5H21C22.6569 22.5 24 21.1569 24 19.5V7.5C24 5.84315 22.6569 4.5 21 4.5H11.874C11.4299 2.77477 9.86384 1.5 8 1.5H4ZM9.73244 4.5C9.38663 3.9022 8.74028 3.5 8 3.5H4V4.5H9.73244ZM3 6.5C2.44772 6.5 2 6.94772 2 7.5V19.5C2 20.0523 2.44772 20.5 3 20.5H21C21.5523 20.5 22 20.0523 22 19.5V7.5C22 6.94772 21.5523 6.5 21 6.5H3Z"
      fill="currentColor"
    />
  </svg>
</div>

      </div>
    </section>

    <section class="minerar-section">
      <h3>ESCOLHA O QUE DESEJA MINERAR:</h3>
      <button type="button" id="selecionarTudo">Selecionar tudo</button>

      <div class="opcoes-grid">
        <label><input type="checkbox" class="opcao-mineracao" value="cdas"> CDAS</label>
        <label><input type="checkbox" class="opcao-mineracao" value="classe"> CLASSE</label>
        <label><input type="checkbox" class="opcao-mineracao" value="data_distribuicao"> DATA DA DISTRIBUIÇÃO</label>
        <label><input type="checkbox" class="opcao-mineracao" value="partes_processo"> PARTES DO PROCESSO</label>
        <label><input type="checkbox" class="opcao-mineracao" value="assunto"> ASSUNTO</label>
        <label><input type="checkbox" class="opcao-mineracao" value="valor_acao"> VALOR DA AÇÃO</label>
        <label><input type="checkbox" class="opcao-mineracao" value="area"> ÁREA</label>
        <label><input type="checkbox" class="opcao-mineracao" value="situacao"> SITUAÇÃO</label>
        <label><input type="checkbox" class="opcao-mineracao" value="foro"> FORO</label>
        <label><input type="checkbox" class="opcao-mineracao" value="vara"> VARA</label>
        <label><input type="checkbox" class="opcao-mineracao" value="tipo_processo"> Processo Virtual</label>
<!--        <label><input type="checkbox" class="opcao-mineracao" value="apensos"> APENSOS/INCIDENTES</label> -->
<!--    <label><input type="checkbox" class="opcao-mineracao" value="ultima_movimentacao"> ULTIMA MOVIMENTAÇÃO</label> -->
</div>
    </section>

    <button id="iniciar">INICIAR MINERAÇÃO</button>
    <div id="status"></div>
  </div>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
